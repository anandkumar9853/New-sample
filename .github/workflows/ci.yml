name: Inventory Tracker CI

on:
  push:
    branches:
      - New-sample
  pull_request:
    branches:
      - New-sample

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate Python application
        run: |
          python -m py_compile app/app.py

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/anandkumar9853/inventory-tracker:${{ github.sha }} \
            ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/anandkumar9853/inventory-tracker:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/anandkumar9853/inventory-tracker:${{ github.sha }}