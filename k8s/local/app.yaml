apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  namespace: inventory-local
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: inventory-app
          image: ghcr.io/anandkumar9853/inventory-tracker:c745a55e6d666a86cd0d0b5d3ad85680631dba92
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: inventory-app-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-app-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-app-secret
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-app
  namespace: inventory-local
spec:
  type: ClusterIP
  selector:
    app: inventory-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000